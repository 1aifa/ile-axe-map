name: Validar fontes alternativas CEP e Google
on:
  push:
    branches: [correcao-geocoordenadas-1237-2026-11-19]
    paths:
      - "scripts/avaliar_fontes_geo_1237.py"
      - ".github/workflows/validar-fontes-geo-1237.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/avaliar_fontes_geo_1237.py
      - name: Salvar confronto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v4_9_candidata/analise_fontes_alternativas_1237.json
          git commit -m "audit: cruzar nomes enderecos e CEP com caches existentes" && git push origin HEAD:correcao-geocoordenadas-1237-2026-11-19
