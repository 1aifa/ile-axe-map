name: Sondagem das fontes geograficas do lote CNPJ
on:
  push:
    branches: [correcao-geocoordenadas-1237-2026-11-19]
    paths:
      - "scripts/sondar_fontes_geo_1237.py"
      - ".github/workflows/sondagem-geocoordenadas-1237.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/sondar_fontes_geo_1237.py
      - name: Guardar sondagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v4_9_candidata/sondagem_fontes_geo.json
          git commit -m "audit: sondar fontes geo preexistentes" && git push origin HEAD:correcao-geocoordenadas-1237-2026-11-19
